openapi: 3.0.3
info:
  title: SecureChat API
  version: 0.1.0
  description: |
    REST contract (doc §7.1). The server only handles ciphertext + minimal metadata.
    senderId is always derived from the JWT, never accepted from the client.
    WebSocket protocol: see docs/api/websocket-protocol.md.
servers:
  - url: http://localhost:8081
  - url: http://localhost:8082
security:
  - bearer: []

paths:
  /v1/auth/register:
    post:
      summary: Create a password account and initial device session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201": { description: registered, content: { application/json: { schema: { $ref: "#/components/schemas/Tokens" } } } }
        "400": { description: invalid username or password }
        "409": { description: username already exists including a passwordless dev account }
        "429": { description: too many attempts }
        "503": { description: authentication unavailable }
  /v1/auth/login:
    post:
      summary: Login on an existing device
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200": { description: logged in, content: { application/json: { schema: { $ref: "#/components/schemas/Tokens" } } } }
        "401": { description: invalid credentials }
        "429": { description: too many attempts }
        "503": { description: authentication unavailable }
  /v1/auth/refresh:
    post:
      summary: Rotate one refresh token; replay revokes the entire session family
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              additionalProperties: false
              properties:
                refreshToken: { type: string, minLength: 43, maxLength: 43 }
      responses:
        "200": { description: rotated, content: { application/json: { schema: { $ref: "#/components/schemas/Tokens" } } } }
        "401": { description: invalid or replayed refresh token }
        "429": { description: too many attempts }
        "503": { description: authentication unavailable }
  /v1/auth/logout:
    post:
      summary: Revoke the current session family including concurrently rotated tokens
      responses:
        "204": { description: logged out }
        "401": { description: no active session }
        "503": { description: authentication unavailable }
  /v1/auth/dev-login:
    post:
      summary: DEV ONLY – issue a token for a username (AUTH_DEV_LOGIN_ENABLED)
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [username], properties: { username: { type: string } } }
      responses:
        "200":
          description: token
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: string, format: uuid }
                  accessToken: { type: string }
                  expiresAt: { type: string, format: date-time }

  /v1/conversations:
    get:
      summary: List my conversations
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object, properties: { conversations: { type: array, items: { $ref: "#/components/schemas/Conversation" } } } } } } }
    post:
      summary: Get or create the 1:1 conversation with a peer
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [peerUserId], properties: { peerUserId: { type: string, format: uuid } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }

  /v1/conversations/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: History, keyset pagination by seq, newest first (RS8)
      parameters:
        - { name: before_seq, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
                  nextBeforeSeq: { type: integer, nullable: true }
        "403": { description: not a member }
    post:
      summary: Send (REST fallback for WS "send"). Idempotent on clientMessageId.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendRequest" }
      responses:
        "201": { description: accepted (new), content: { application/json: { schema: { $ref: "#/components/schemas/Accepted" } } } }
        "200": { description: accepted (duplicate retry), content: { application/json: { schema: { $ref: "#/components/schemas/Accepted" } } } }
        "409": { description: clientMessageId reused with changed conversation or payload }
        "403": { description: not a member }

  /v1/messages/{id}/receipts:
    post:
      summary: Delivered / read ACK (RS6). Idempotent.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [state], properties: { state: { type: string, enum: [delivered, read] } } }
      responses:
        "204": { description: recorded }

  /v1/sync:
    post:
      summary: Cursor-based offline sync (RS3, RS4). PostgreSQL only – works when Kafka is down.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cursors:
                  type: object
                  description: conversationId → last seq the client has
                  additionalProperties: { type: integer, format: int64 }
                receiptCursors:
                  type: object
                  description: conversationId to last persisted receiptSeq; independent from message cursor
                  additionalProperties: { type: integer, format: int64, minimum: 0 }
                limit: { type: integer, default: 50 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      type: object
                      properties:
                        conversationId: { type: string, format: uuid }
                        messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
                        nextCursor: { type: integer }
                        hasMore: { type: boolean }
                        receipts: { type: array, items: { $ref: "#/components/schemas/Receipt" } }
                        nextReceiptCursor: { type: integer, format: int64 }
                        hasMoreReceipts: { type: boolean }

  /v1/keys/bundle:
    put:
      summary: Upload my PUBLIC Signal pre-key bundle (SC2)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, registrationId, identityKey, signedPreKeyId, signedPreKey, signedPreKeySignature]
              properties:
                deviceId: { type: integer }
                registrationId: { type: integer }
                identityKey: { type: string, format: byte }
                signedPreKeyId: { type: integer }
                signedPreKey: { type: string, format: byte }
                signedPreKeySignature: { type: string, format: byte }
                oneTimePreKeys:
                  type: array
                  items: { type: object, properties: { keyId: { type: integer }, publicKey: { type: string, format: byte } } }
      responses:
        "204": { description: stored }

  /v1/users/{id}/devices/{deviceId}/bundle:
    get:
      summary: Claim a peer's bundle (consumes one one-time pre-key)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: deviceId, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: bundle }
        "404": { description: no bundle }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Credentials:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, pattern: "^[a-zA-Z0-9_]{3,32}$" }
        password: { type: string, maxLength: 1024, description: "Server enforces 12 to 1024 UTF-8 bytes; byte count differs from JSON Schema character count. Hashes a domain-separated SHA-256 digest with bcrypt cost 12." }
        deviceId: { type: integer, minimum: 1, maximum: 2147483647, default: 1 }
    Tokens:
      type: object
      required: [userId, deviceId, accessToken, refreshToken, expiresAt]
      properties:
        userId: { type: string, format: uuid }
        deviceId: { type: integer }
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresAt: { type: string, format: date-time }
    Receipt:
      type: object
      properties:
        receiptSeq: { type: integer, format: int64 }
        messageId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        seq: { type: integer, format: int64 }
        recipientId: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        state: { type: string, enum: [delivered, read] }
        at: { type: string, format: date-time }
    Conversation:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [direct, group] }
        lastSeq: { type: integer }
        members: { type: array, items: { type: string, format: uuid } }
        createdAt: { type: string, format: date-time }
    SendRequest:
      type: object
      additionalProperties: false
      required: [clientMessageId, ciphertext]
      properties:
        clientMessageId: { type: string, maxLength: 64, description: "UUID generated by client; reuse on retry" }
        ciphertext: { type: string, format: byte, description: "Base64 ciphertext; decoded bytes limited by WS_MAX_MESSAGE_BYTES (default 65536), shared by REST and WS. REST JSON body limit is 1 MiB." }
        protocolMeta: { type: object, description: "Signal message type, deviceId, registrationId…; at most 4096 serialized bytes" }
        clientCreatedAt: { type: string, format: date-time, description: reference only }
    Accepted:
      type: object
      properties:
        messageId: { type: string, format: uuid }
        clientMessageId: { type: string }
        conversationId: { type: string, format: uuid }
        seq: { type: integer }
        state: { type: string, enum: [accepted] }
        duplicate: { type: boolean }
    Message:
      type: object
      properties:
        messageId: { type: string, format: uuid }
        clientMessageId: { type: string }
        conversationId: { type: string, format: uuid }
        seq: { type: integer }
        senderId: { type: string, format: uuid }
        ciphertext: { type: string, format: byte }
        protocolMeta: { type: object }
        clientCreatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
