global:
  scrape_interval: 5s

scrape_configs:
  - job_name: securechat-backend
    static_configs:
      - targets: ["backend-a:8080", "backend-b:8080"]
        labels: { app: securechat }
  # Consumer lag (KF9) is exported by each backend as
  # securechat_kafka_consumer_lag{group,topic} (kadm, committed offsets), so no
  # separate kafka-exporter container is needed on this memory-limited setup.
