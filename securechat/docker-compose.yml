# SecureChat MVP environment (INF1, INF6).
# Two backend instances (gw-A :8081, gw-B :8082) to test cross-instance routing (RS13, EXP2/EXP3).
# Usage:  cp .env.example .env && docker compose up --build
name: securechat

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  env_file: .env
  depends_on:
    postgres: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_started }
    kafka-init: { condition: service_completed_successfully }
  environment: &backend-env
    POSTGRES_DSN: postgres://securechat:securechat@postgres:5432/securechat?sslmode=disable
    REDIS_ADDR: redis:6379
    KAFKA_BROKERS: kafka:9092
    HTTP_ADDR: ":8080"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: securechat
      POSTGRES_PASSWORD: securechat
      POSTGRES_DB: securechat
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securechat"]
      interval: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres: { condition: service_healthy }
    volumes: [./backend/migrations:/migrations:ro]
    command: ["-path=/migrations", "-database=postgres://securechat:securechat@postgres:5432/securechat?sslmode=disable", "up"]

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # ephemeral by design

  kafka:
    image: apache/kafka:3.8.0
    ports: ["127.0.0.1:${KAFKA_PORT:-9094}:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: [kafkadata:/var/lib/kafka/data]

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on: [kafka]
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    volumes: [./deploy/kafka:/scripts:ro]

  backend-a:
    <<: *backend
    ports: ["127.0.0.1:${BACKEND_A_PORT:-8081}:8080"]
    environment:
      <<: *backend-env
      INSTANCE_ID: gw-A

  backend-b:
    <<: *backend
    ports: ["127.0.0.1:${BACKEND_B_PORT:-8082}:8080"]
    environment:
      <<: *backend-env
      INSTANCE_ID: gw-B

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    ports: ["9090:9090"]
    volumes: [./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]

  # TODO(FE1): frontend dev server (profile "frontend")

volumes:
  pgdata:
  kafkadata:
