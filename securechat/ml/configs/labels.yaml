# Label contract (AI3, AI15). Shared by ml/ and frontend/src/ai/contract.ts.
# v1: tiếng Việt, 3 nhãn cho tin nhắn (phishing gộp vào scam). Đổi nhãn/ngưỡng => cập nhật CẢ contract.ts và file này, tăng modelVersion.
version: 1

message_model:
  labels:
    - id: benign
      definition: "Hội thoại bình thường (kể cả tin ngân hàng/nhà mạng thật, không yêu cầu hành động nguy hiểm)."
    - id: spam
      definition: "Quảng cáo, khuyến mãi, tin hàng loạt không mời; không nhằm chiếm đoạt tiền/thông tin."
    - id: scam
      definition: "Lừa đảo, kể cả phishing: giả mạo để lấy OTP/mật khẩu/thông tin, yêu cầu chuyển tiền, đầu tư/việc nhẹ lương cao/trúng thưởng giả, giả công an/ngân hàng/shipper."
  risky_labels: [spam, scam]   # cảnh báo khi P(risky) = 1 - P(benign) >= threshold
  threshold: null              # chọn trên VALIDATION (AI25), ghi vào models/artifacts/message/threshold.json
  languages: [vi]

url_model:
  labels:
    - id: benign
    - id: malicious
  threshold: null              # chọn trên validation, ràng buộc FPR (xem configs/url.yaml)

runtime:
  target: typescript-json+onnxruntime-web   # message: JSON + TS; url: LR JSON hoặc ONNX
  timeout_ms: null             # quá hạn => status "timeout"/"unavailable", KHÔNG bao giờ "safe"
