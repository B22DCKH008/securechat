seed: 42

# Tên file nằm trong data/raw/ (hoặc data/demo/raw/ khi chạy --demo)
files:
  train_pool: messages_train_pool.csv      # real + synthetic. Cột: text,label,source[,group,lang]
  handlabeled: messages_handlabeled.csv    # TEST gán tay. Cột: text,label[,hard,source,note]

featurizer:                # PHẢI giống hệt phía TypeScript (xem docs trong README, mục "Parity")
  strip_diacritics: true   # bỏ dấu + đ->d: bền với tin không dấu/teencode
  char_ngram: [2, 5]
  word_ngram: [1, 2]
  sublinear_tf: true
  min_df: 2
  max_features: 50000

model:
  C: 4.0
  class_weight: balanced
  max_iter: 2000

dedupe:
  near_dup_cosine: 0.85    # >= ngưỡng này coi là cùng nhóm (cùng template) => không bị chia sang tập khác

split:
  val_fraction: 0.15
  val_min_real: 150        # nếu có >= số tin "real" này thì validation lấy từ tin real
  val_synthetic_fraction: 0.20   # 0 = validation chỉ gồm tin real (lần 1, toàn SMS). > 0: thêm ngần ấy NHÓM tin tổng hợp vào validation
                                 # (lần 2: để validation có cả tin chat; phần này lạc quan hơn chat thật, chỉ dùng để chọn ngưỡng)

threshold:
  target_precision: 0.95   # CHỌN ngưỡng trên validation: recall lớn nhất với precision >= giá trị này (risky vs benign).
                           # Lần 1 dùng 0.90 và validation đạt đúng 0.902 (không có biên an toàn) => test chỉ được 0.782.
                           # Lần 2 đặt 0.95 vì recall còn dư xa (0.985 so với 0.80). Quyết định SAU khi thấy kết quả lần 1.
  quality_precision: 0.90  # tiêu chí ĐẠT trên test gán tay, đặt TRƯỚC khi xem kết quả, KHÔNG đổi (khác với target_precision ở trên)
  target_recall: 0.80      # tiêu chí ĐẠT: recall tối thiểu trên test gán tay (đặt TRƯỚC khi xem kết quả, không đổi)

bootstrap:
  n: 500

sweep_max_features: [5000, 10000, 20000, 50000]   # AI11: tỉa vocab, đo size/F1/latency
